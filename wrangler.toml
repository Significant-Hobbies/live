name = "significanthobbies"
main = "worker.mjs"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# All routes hit worker.mjs first except content-hashed immutable Astro and
# Next.js assets, which bypass the Worker to avoid cold-start TTFB.
assets = { directory = ".open-next/assets", binding = "ASSETS", run_worker_first = [ "/*", "!/_astro/*", "!/_next/static/*" ] }

routes = [
  { pattern = "significanthobbies.com/*", zone_name = "significanthobbies.com" },
  { pattern = "www.significanthobbies.com/*", zone_name = "significanthobbies.com" },
  { pattern = "live.significanthobbies.com", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
NODE_ENV = "production"
APPLE_APP_BUNDLE_IDENTIFIER = "com.significanthobbies.app"

# ─── Email Sending binding (weekly-log Sunday nudge) ───────────────────────
# Domain onboarded via `wrangler email sending enable significanthobbies.com`.
# Used by the cron handler in worker.mjs (weekly-nudge-email.mjs).
[[send_email]]
name = "EMAIL"

# ─── Cron: the Sunday pull ──────────────────────────────────────────────────
# Two fires cover the globe: 22:00 UTC Saturday reaches UTC+12..+14 Sunday
# morning; 14:00 UTC daily reaches everyone else. The handler itself filters
# to owners whose local day is actually Sunday and whose week is unwritten.
[triggers]
crons = ["0 22 * * 6", "0 14 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "significanthobbies"
database_id = "da450bef-a88d-4bc6-8013-35e3d96f70bd"
preview_database_id = "bbbdc0a6-a4ad-4881-8c71-cfc3f2a3b234"
migrations_dir = "migrations/d1"

[[services]]
binding = "HUB_SERVICE"
service = "personal-platform"

[[services]]
binding = "FREE_AI"
service = "free-ai-gateway"
entrypoint = "FleetGateway"

# ─── Preview environment ───────────────────────────────────────────────
# Used by the PR deploy job: `wrangler deploy --env preview`. Deploys to
# significanthobbies-preview.<account>.workers.dev (no production routes).
# Routes intentionally absent so PRs never touch the prod domain.

[env.preview]
name = "significanthobbies-preview"
# Disinherit prod routes — preview deploys to the workers.dev subdomain
# only. Without these overrides wrangler tries to attach the preview
# worker to significanthobbies.com/* and fails because the prod worker
# already owns them.
workers_dev = true
routes = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "significanthobbies-preview"
database_id = "bbbdc0a6-a4ad-4881-8c71-cfc3f2a3b234"
migrations_dir = "migrations/d1"

[env.preview.observability]
enabled = true
head_sampling_rate = 0.1

[env.preview.limits]
cpu_ms = 30000

[env.preview.vars]
NODE_ENV = "production"
APPLE_APP_BUNDLE_IDENTIFIER = "com.significanthobbies.app"

[[env.preview.services]]
binding = "FREE_AI"
service = "free-ai-gateway"
entrypoint = "FleetGateway"
