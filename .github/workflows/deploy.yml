name: Deploy to Cloudflare Workers
# Rollback: `wrangler versions rollback` from the repo root, or via
# dash.cloudflare.com → Workers → significanthobbies → Versions → "Rollback".
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fail fast, and name what is missing.
      #
      # Every run of this workflow so far has died the same way: ~2.5 minutes
      # of install + Next build, and then Wrangler hands off to
      # `opennextjs-cloudflare deploy`, whose nested remote-proxy session dies
      # with an opaque "Failed to start the remote proxy session" stack trace.
      # The real cause is simply that the two secrets below are not set on this
      # repository, so every `${{ secrets.* }}` reference resolves to an empty
      # string. Checking them up front turns a slow, misleading failure into an
      # instant, actionable one.
      #
      # Set them under Settings -> Secrets and variables -> Actions ->
      # Repository secrets:
      #   CLOUDFLARE_API_TOKEN  - Workers Scripts:Edit plus the resources bound
      #                           in wrangler.toml (D1, Workers AI), and
      #                           optionally Zone:Cache Purge for the purge step.
      #   CLOUDFLARE_ACCOUNT_ID - the account that owns the `significanthobbies`
      #                           Worker.
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions -> Repository secrets, then re-run this workflow."
            exit 1
          fi
          echo "Cloudflare credentials are present."
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare pnpm
        run: |
          corepack enable
          if node -e "const pm=require('./package.json').packageManager||''; process.exit(pm.startsWith('pnpm@')?0:1)"; then
            corepack install
          else
            corepack prepare pnpm@10.33.2 --activate
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Build the deploy artifact without populateCache. The package-level
      # cf:build command also warms a local cache through Wrangler, which needs
      # Cloudflare credentials and is not required to produce .open-next/.
      - run: node scripts/cf-build.mjs
      - uses: cloudflare/wrangler-action@v3
        env:
          # OpenNext starts a nested Wrangler remote-proxy process. Pass the
          # credentials through the step environment as well as the action
          # inputs so that subprocess can authenticate in CI.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Code releases preserve the existing routes, domains and schedules.
          # A full deploy also reconciles routes and requires zone-wide access.
          command: |
            versions upload --minify --tag ${{ github.sha }} --keep-vars
            versions deploy --version-tag ${{ github.sha }}@100 --yes
      - name: Purge edge cache
        # Purges the whole zone, not just `/`.
        #
        # worker.mjs edge-caches every path in its CACHEABLE_EXACT set and under
        # its CACHEABLE_PREFIXES (/hobbies, /blog, /bucket-lists, /tools) with
        # s-maxage=86400. Purging only `/` left all of those serving pre-deploy
        # HTML for up to a day — a real deploy shipped a new /hobbies and
        # production kept showing the old one, with the wrong hobby count and
        # none of the new UI. The smoke check below only asserts on `/`, so
        # nothing caught it.
        #
        # Best-effort: a missing zone cache_purge permission (401) must not fail
        # a good deploy.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          zone_id=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=significanthobbies.com" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.result?.[0]?.id||'')})")
          if [ -z "$zone_id" ]; then
            echo "WARN: could not resolve zone id — skipping purge"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Purged the whole zone for significanthobbies.com"
      - name: Smoke check production
        # These two checks answer one question: is each host serving its own
        # page, rather than the other host's?
        #
        # They used to assert on headline copy ("Your personal apps", "Live —
        # Map your hobby journey across life"). Both strings have since been
        # rewritten on the pages themselves, so the assertions would now fail
        # a perfectly good deploy — a marketing copy edit should never be able
        # to break the deploy pipeline. Assert on structural markers instead:
        # the apex's apps-section id and each host's self-canonical link. Those
        # change only when the page's identity changes, which is exactly the
        # regression worth failing on.
        run: |
          if ! html=$(curl -fsS --retry 3 --retry-delay 5 --max-time 20 \
            -H "Cache-Control: no-cache" https://significanthobbies.com/); then
            echo "ERROR: failed to fetch homepage"
            exit 1
          fi
          if ! printf '%s' "$html" | grep -q 'rel="canonical" href="https://significanthobbies.com/"'; then
            echo "ERROR: the apex is not serving a self-canonical page — it is redirecting or serving another host's HTML"
            exit 1
          fi
          if ! printf '%s' "$html" | grep -q 'id="apps-title"'; then
            echo "ERROR: stale overlay — the apex is missing the Hub apps section"
            exit 1
          fi
          echo "Hub OK: the apex serves its own self-canonical Hub page"

          live_html=$(curl -fsS --retry 6 --retry-all-errors --retry-delay 10 --max-time 20 \
            -H "Cache-Control: no-cache" https://live.significanthobbies.com/)
          if ! printf '%s' "$live_html" | grep -q 'rel="canonical" href="https://live.significanthobbies.com'; then
            echo "ERROR: the Live custom domain is not serving the Live landing"
            exit 1
          fi
          echo "Live OK: the cinematic landing is available on its custom domain"
      - name: Smoke check a Worker-rendered page
        # Two different questions, and only the first should fail a deploy.
        #
        # 1. Did the deploy ship correct code? Asked with a cache-busting query
        #    param, because worker.mjs keys caches.default on the full request
        #    URL — so `?cb=` is a guaranteed miss and a fresh SSR. A request
        #    header of `Cache-Control: no-cache` is NOT enough: that is a hint to
        #    the CDN, and the Worker's own cache.match() ignores it. Getting that
        #    wrong made the first version of this step fail a good deploy.
        #
        # 2. Has the purge reached this colo yet? Asked without the param.
        #    Cloudflare purge propagation is asynchronous, so a stale answer here
        #    is a timing fact, not a broken release — it warns and moves on.
        run: |
          url=https://live.significanthobbies.com/hobbies
          marker='Browse by what suits you'

          fresh=$(curl -fsS --retry 3 --retry-delay 5 --max-time 20 "${url}?cb=${GITHUB_RUN_ID}")
          if ! printf '%s' "$fresh" | grep -q "$marker"; then
            echo "ERROR: a freshly rendered /hobbies is missing the facet browser."
            echo "The deploy shipped code that does not render it — this is not a cache problem."
            exit 1
          fi
          echo "Deployed code OK: /hobbies renders the facet browser."

          legacy=https://significanthobbies.com/hobbies
          redirect=$(curl -sS -o /dev/null -w '%{redirect_url}' "$legacy")
          if [ "$redirect" != "$url" ]; then
            echo "ERROR: legacy apex Live route did not redirect to $url"
            exit 1
          fi
          echo "Host boundary OK: legacy apex Live route redirects to the Live host."

          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$url" | grep -q "$marker"; then
              echo "Edge cache OK: purge reached this colo after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Cached copy still stale (attempt ${attempt}/6) — waiting for purge to propagate."
            sleep 15
          done
          echo "WARN: the cached /hobbies is still pre-deploy after ~90s."
          echo "Purge propagation is asynchronous and s-maxage is 86400, so this"
          echo "normally resolves on its own. See docs/operations/runbook.md."
