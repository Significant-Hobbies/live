name: Production Smoke
on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Hub homepage
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" \
            -A "smoke-probe/1.0" \
            --max-time 20 \
            https://significanthobbies.com/)
          echo "HTTP status: $status"
          case "$status" in
            200)
              echo "OK"
              ;;
            429|1015)
              echo "ERROR: Cloudflare rate limiting active (HTTP $status) — remove zone-level rate limit rule in Cloudflare dashboard"
              exit 1
              ;;
            *)
              echo "ERROR: Unexpected status $status"
              exit 1
              ;;
          esac
      - name: Probe canonical Live host
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" \
            -A "smoke-probe/1.0" \
            --max-time 20 \
            https://live.significanthobbies.com/live-more)
          if [ "$status" != "200" ]; then
            echo "ERROR: canonical Live route returned HTTP $status"
            exit 1
          fi

          location=$(curl -s -o /dev/null -w "%{redirect_url}" \
            -A "smoke-probe/1.0" \
            --max-time 20 \
            https://significanthobbies.com/live-more)
          if [ "$location" != "https://live.significanthobbies.com/live-more" ]; then
            echo "ERROR: legacy apex route did not move to the canonical Live host"
            exit 1
          fi
