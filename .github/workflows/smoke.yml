name: Production Smoke
on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Live homepage
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" \
            -A "smoke-probe/1.0" \
            --max-time 20 \
            https://significanthobbies.com/)
          echo "HTTP status: $status"
          case "$status" in
            200)
              echo "OK"
              ;;
            429|1015)
              echo "ERROR: Cloudflare rate limiting active (HTTP $status) — remove zone-level rate limit rule in Cloudflare dashboard"
              exit 1
              ;;
            *)
              echo "ERROR: Unexpected status $status"
              exit 1
              ;;
          esac
      - name: Probe Live app on both origins
        run: |
          for origin in https://significanthobbies.com https://live.significanthobbies.com; do
            status=$(curl -o /dev/null -s -w "%{http_code}" \
              -A "smoke-probe/1.0" --max-time 20 "${origin}/live-more")
            if [ "$status" != "200" ]; then
              echo "ERROR: ${origin}/live-more returned HTTP $status"
              exit 1
            fi
          done
      - name: Probe apex crawler and agent contract
        run: |
          # Live now owns the apex public discovery contract.
          fail=0
          for path in /robots.txt /sitemap.xml /llms.txt /llms-full.txt \
                      /index.md /api/ai /api-ai.json /.well-known/security.txt; do
            status=$(curl -o /dev/null -s -w "%{http_code}" \
              -A "smoke-probe/1.0" --max-time 20 \
              "https://significanthobbies.com${path}")
            if [ "$status" != "200" ]; then
              echo "ERROR: apex ${path} returned HTTP $status (expected 200, on-host)"
              fail=1
            fi
          done

          name=$(curl -fsS -A "smoke-probe/1.0" --max-time 20 \
            https://significanthobbies.com/api/ai \
            | jq -er '.name | select(type == "string")')
          if [ "$name" != "Live" ]; then
            echo "ERROR: apex /api/ai declares name '$name', expected 'Live'"
            fail=1
          fi

          if curl -s -A "smoke-probe/1.0" --max-time 20 \
              https://significanthobbies.com/robots.txt \
              | grep -q '^Sitemap: https://live\.'; then
            echo "ERROR: apex robots.txt advertises a sitemap on a foreign host"
            fail=1
          fi

          if curl -s -A "smoke-probe/1.0" --max-time 20 \
              https://significanthobbies.com/sitemap.xml \
              | grep -q '<loc>https://live\.'; then
            echo "ERROR: apex sitemap lists URLs on a foreign host"
            fail=1
          fi

          exit $fail
      - name: Probe HEAD parity on both hosts
        run: |
          # HEAD must return the same status as GET for the same URL — a
          # divergence is exactly what uptime monitors and link-checkers use
          # HEAD to detect (Significant-Hobbies/live#10).
          fail=0
          for url in https://live.significanthobbies.com/ https://significanthobbies.com/; do
            head_status=$(curl -o /dev/null -s -I -w "%{http_code}" \
              -A "smoke-probe/1.0" --max-time 20 "$url")
            get_status=$(curl -o /dev/null -s -w "%{http_code}" \
              -A "smoke-probe/1.0" --max-time 20 "$url")
            if [ "$head_status" != "$get_status" ]; then
              echo "ERROR: ${url} HEAD returned $head_status but GET returned $get_status"
              fail=1
            fi
          done
          exit $fail
      - name: Probe the apex OG image
        run: |
          # The apex's own OG tags reference /hub-opengraph-image; it must
          # resolve to a real image, not dangle on a 404 (live#10).
          status=$(curl -o /dev/null -s -L -w "%{http_code}" \
            -A "smoke-probe/1.0" --max-time 20 \
            https://significanthobbies.com/hub-opengraph-image)
          if [ "$status" != "200" ]; then
            echo "ERROR: apex OG image resolved to HTTP $status"
            exit 1
          fi

          content_type=$(curl -o /dev/null -s -L -w "%{content_type}" \
            -A "smoke-probe/1.0" --max-time 20 \
            https://significanthobbies.com/hub-opengraph-image)
          case "$content_type" in
            image/*) echo "OK: $content_type" ;;
            *)
              echo "ERROR: apex OG image content-type is '$content_type', expected image/*"
              exit 1
              ;;
          esac
