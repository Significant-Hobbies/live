name = "significanthobbies-local"
main = "worker.mjs"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Local-only D1 binding. Production receives its database_id in wrangler.toml
# only after the migration receipt and cutover approval are complete.
[[d1_databases]]
binding = "DB"
database_name = "significanthobbies-local"
database_id = "local"
migrations_dir = "migrations/d1"
